name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # docket is macOS-only — launchd, osascript, the darwin-only release
    # binaries. On Linux every `process.platform !== "darwin"` branch short-
    # circuits, so the tests that cover them pass without running anything.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # pinned: an unpinned setup handed a release a bun the tests had
          # never met (1.4.0 broke the wizard's readline use). Bump on purpose.
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun test
